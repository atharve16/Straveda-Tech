<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tax Invoice</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:#111827;display:flex;flex-direction:column;min-height:100vh}
  header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1 1 200px}
  header small{display:block;font-weight:400;color:#6b7280;font-size:12px;margin-top:2px}
  a.btn{background:#0b5cad;color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600}
  main{flex:1;display:flex;flex-direction:column}
  iframe{flex:1;width:100%;border:0;min-height:70vh;background:#fff}
  .msg{margin:40px 16px;text-align:center;color:#6b7280}
  .msg.err{color:#b91c1c}
</style>
</head>
<body>
<header><h1 id="t">Tax Invoice<small id="s"></small></h1><a class="btn" id="dl" href="#" hidden>Open / Download PDF</a></header>
<main id="m"><div class="msg">Loading invoice…</div></main>
<script src="jspdf.umd.min.js"></script>
<script src="qrcode.js"></script>
<script src="salesorder.js?v=20261118c"></script>
<script>
(async()=>{
  const m=document.getElementById('m');
  try{
    const t=new URLSearchParams(location.search).get('t')||'';
    const res=await fetch('orders.php?action=public_invoice&t='+encodeURIComponent(t),{headers:{Accept:'application/json'}});
    const j=await res.json().catch(()=>({}));
    if(!res.ok||!j.ok)throw new Error(j.error||'Invoice not found.');
    const o=j.order;
    o.doc_token=t;   // the PDF's own QR code points back to this page
    const r=window.OM_SO.makeInvoice(o);
    const url=URL.createObjectURL(r.doc.output('blob'));
    document.title=r.name.replace(/\.pdf$/,'');
    document.getElementById('s').textContent=o.outlet+' · '+o.voucher_no;
    const a=document.getElementById('dl');a.href=url;a.download=r.name;a.hidden=false;
    m.innerHTML='';
    const f=document.createElement('iframe');f.title='Tax Invoice';f.src=url+'#view=FitH';m.appendChild(f);
  }catch(e){m.innerHTML='<div class="msg err"></div>';m.firstChild.textContent=e.message;}
})();
</script>
</body>
</html>
